name: Deploy Dashboard (GitHub Pages)

# Hospedagem OFICIAL do dashboard (decisão de 05/08/2026 — Netlify saiu
# do projeto). Coleta os dados na hora e publica o front COM os dados
# embutidos — modelo sem login desta fase. Quando o Supabase entrar, o
# passo condicional abaixo remove os dados do artefato automaticamente.

on:
  push:
    branches: [main]
    paths: ["dashboard/**", ".github/workflows/deploy_pages.yml"]
  schedule:
    # 1x/dia às 06:00 BRT (09:00 UTC) — decisão da gestora para economizar
    # o limite de deploys quando a Netlify voltar. O GitHub pode atrasar
    # alguns minutos o cron; o site publica "por volta das 6h".
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gate de secrets (nunca publicar dado vazio)
        env:
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: |
          if [ -z "$KOMMO_TOKEN" ] || [ -z "$META_ACCESS_TOKEN" ]; then
            echo "::error::KOMMO_TOKEN/META_ACCESS_TOKEN ausentes nos Secrets"
            exit 1
          fi

      - name: Coleta + ETL (dados frescos a cada publicação)
        env:
          KOMMO_SUBDOMAIN: ${{ secrets.KOMMO_SUBDOMAIN }}
          KOMMO_TOKEN: ${{ secrets.KOMMO_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
          GOOGLE_ADS_DEVELOPER_TOKEN: ${{ secrets.GOOGLE_ADS_DEVELOPER_TOKEN }}
          GOOGLE_ADS_CLIENT_ID: ${{ secrets.GOOGLE_ADS_CLIENT_ID }}
          GOOGLE_ADS_CLIENT_SECRET: ${{ secrets.GOOGLE_ADS_CLIENT_SECRET }}
          GOOGLE_ADS_REFRESH_TOKEN: ${{ secrets.GOOGLE_ADS_REFRESH_TOKEN }}
          GOOGLE_ADS_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_CUSTOMER_ID }}
          GOOGLE_ADS_LOGIN_CUSTOMER_ID: ${{ secrets.GOOGLE_ADS_LOGIN_CUSTOMER_ID }}
          GOOGLE_SA_JSON_B64: ${{ secrets.GOOGLE_SA_JSON_B64 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python -u main.py
          python -u scripts/generate_dashboard_data.py

      # Com Supabase configurado o dado oficial vive no bucket PRIVADO e o
      # site publicado não carrega nenhum dado (o front baixa após login).
      # Sem Supabase (fase-ponte), o dado vai embutido — modelo sem senha.
      - name: Modo autenticado — remover dados do artefato
        env:
          TEM_SUPABASE: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$TEM_SUPABASE" ]; then
            rm -f dashboard/data/summary.json dashboard/data/summary.js
            echo "Modo autenticado: dados removidos do artefato (vivem no bucket privado)."
          else
            echo "Fase-ponte sem Supabase: dados seguem embutidos no site."
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/

      - id: deployment
        uses: actions/deploy-pages@v4
