<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Terrana B2B — Performance · Agência Delucca</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

  <!-- carregando / erro -->
  <div id="loading">
    <div>
      <div class="spin"></div>
      <p id="loading-msg">Carregando dados…</p>
    </div>
  </div>

  <!-- sidebar -->
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-row">
        <div class="brand-mark">T</div>
        <div class="brand-name">Terrana</div>
      </div>
      <div class="brand-perf">PERFORMANCE</div>
    </div>
    <div class="front-badge">
      <div class="front-name">B2B — Parcerias</div>
      <div class="front-sub">frente única</div>
    </div>
    <nav id="nav"></nav>
    <div class="sidebar-foot"><strong>Agência Delucca</strong><br>dashboard de performance</div>
  </aside>

  <!-- conteúdo -->
  <div id="main">
    <header id="topbar">
      <h1 id="page-title">Terrana B2B</h1>
      <div id="period-filter">
        <label>De <input type="date" id="f-start" placeholder="dd/mm/aaaa"></label>
        <label>Até <input type="date" id="f-end" placeholder="dd/mm/aaaa"></label>
        <select id="f-preset">
          <option value="all">Todo período</option>
          <option value="7">Últimos 7 dias</option>
          <option value="30">Últimos 30 dias</option>
          <option value="90">Últimos 90 dias</option>
          <option value="custom" hidden>Personalizado</option>
        </select>
      </div>
    </header>
    <main id="content"></main>
    <footer id="footer"><strong>Agência Delucca</strong> — dashboard de performance · Terrana B2B · <span id="stamp"></span></footer>
  </div>

  <!-- Dados embutidos (permite abrir com duplo clique); fallback: fetch de data/summary.json -->
  <script src="data/summary.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
